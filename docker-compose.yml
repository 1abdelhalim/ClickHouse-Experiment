services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ch_experiment
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - ch_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  ch_data:
